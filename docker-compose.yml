services:
  api:
    build: .
    container_name: fastapi_api
    restart: always

    ports:
      - "8000:8000"

    depends_on:
      - redis
      - postgres
      - minio

    env_file:
      - .env

    volumes:
      - .:/app

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers

  worker_inspection:
    build: .
    container_name: worker_inspection
    restart: always

    depends_on:
      - redis
      - postgres
      - minio

    env_file:
      - .env

    volumes:
      - .:/app

    command: rq worker inspection reconditioning

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

  adminer:
    image: adminer
    restart: always

    ports:
      - "8080:8080"

volumes:
  pgdata:
  minio_data:
